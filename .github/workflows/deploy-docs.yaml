name: Deploy Docs to Synology

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # QUITAMOS la sección 'container' por completo
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        env:
          GIT_CONFIG_PARAMETERS: "'url.https://git.natxocc.com/.insteadOf=http://gitea:3000/'"

      - name: Copiar archivos directamente
        run: |
          # Como corre en el host del runner, ya tiene acceso a la ruta
          cp -r docs/. /volume1/webdocs/sigpro/
          ls -la /volume1/webdocs/sigpro