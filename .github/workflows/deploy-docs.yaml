name: Deploy Docs to Synology

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # VOLVEMOS al contenedor porque es el que sabe resolver la red
    container:
      image: node:20-bullseye
      options: >-
        --dns 192.168.1.1
        --add-host git.natxocc.com:host-gateway
        --add-host gitea:host-gateway
        -v /volume1/webdocs/sigpro:/target_folder

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        env:
          # Mantenemos tu configuración original que SÍ llegaba a conectar
          GIT_CONFIG_PARAMETERS: "'url.https://git.natxocc.com/.insteadOf=http://gitea:3000/'"

      - name: Copiar archivos
        run: |
          # Usamos el mapeo que definimos en 'options' (-v ...:/target_folder)
          # Esto evita que Node tenga que adivinar rutas del NAS
          cp -r docs/. /target_folder/
          
          echo "Verificando archivos en el destino:"
          ls -la /target_folder
          
          # Ajustamos permisos
          chmod -R 755 /target_folder