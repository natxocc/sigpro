name: Deploy Docs to Synology

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: node:20-bullseye
      options: >-
        --dns 192.168.1.1
        --add-host git.natxocc.com:host-gateway
        --add-host gitea:host-gateway
        -v /volume1/webdocs/sigpro:/volume1/webdocs/sigpro

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        env:
          # Configuración de red que ya sabemos que funciona
          GIT_CONFIG_PARAMETERS: "'url.https://git.natxocc.com/.insteadOf=http://gitea:3000/'"

      - name: Copiar archivos a Web Station
        run: |
          cp -r docs/. /volume1/webdocs/sigpro/
          ls -la /volume1/webdocs/sigpro/
          chmod -R 755 /volume1/webdocs/sigpro/