name: Deploy Docs to Synology

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        env:
          # Configuración de red que ya sabemos que funciona
          GIT_CONFIG_PARAMETERS: "'url.http://192.168.1.100:3333/.insteadOf=https://git.natxocc.com/'"

      - name: Copiar archivos a Web Station
        run: |
          cp -r docs/. /volume1/webdocs/sigpro/
          ls -la /volume1/webdocs/sigpro/
          chmod -R 755 /volume1/webdocs/sigpro/