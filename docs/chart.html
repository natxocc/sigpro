<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SigPro — Demo Chart</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <header style="padding: 1rem; background: #0f172a; color: #e2e8f0;">
    <h1>SigPro demo — Chart &nbsp;<code>sandbox:sigpro/chart</code></h1>
    <nav>
      <a href="./grid.html">Grid</a> · <a href="./chart.html">Chart</a> · <a href="./calendar.html">Calendar</a> · <a href="./combined.html">Combined</a>
    </nav>
  </header>

  <div id="app"></div>

  <script type="module">
    import { signal, mount, exposeTags, h } from './sigpro.js';
    import { Chart } from './sigpro.chart.js';

    exposeTags();

    // tres series de datos: data() es una función → reactividad automática
    const s0 = [12, 56, 34, 89, 45, 67];
    const s1 = [40, 28, 73, 55, 91, 30];
    const s2 = [65, 82, 19, 71, 44, 58];
    const series = [s0, s1, s2];
    const labels = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'];

    // índice reactivo: al cambiarlo el chart se actualiza solo (sin re-crear)
    const si = signal(0);

    // dark reactivo
    const dark = signal(false);

    const App = () =>
      h('div', { class: 'app' }, [
        h('section', { class: 'card' }, [
          h('h2', {}, 'Chart — reactive data + dark'),
          h('div', { id: 'chart', style: 'height: 300px; margin-bottom: .5rem' }, [
            h(Chart, {
              // options staticas o getter reactivo
              options: {
                chart: { type: 'bar' },
                title: { text: () => `Datos (serie ${si() + 1})` },
                xAxis: { categories: labels },
                credits: { enabled: false },
              },
              // data como función reactiva (también acepta array directo)
              data: () => series[si()].map((v, i) => ({ name: labels[i], y: v })),
              dark: () => dark(),
              on: {
                onClick(e) {
                  console.log('chart clicked:', e.point?.name, '=', e.point?.y);
                },
              },
            }),
          ]),
        ]),
      ]);

    mount(App, '#app');

    // botones fuera del árbol reactivo (DOM imperativo)
    document.querySelectorAll('a').forEach(a => a.style.color = '#93c5fd');

    // cambia serie reactivamente
    setInterval(() => si(si() + 1), 3000);

    // alternar dark cada 8s
    setInterval(() => dark(!dark()), 8000);
  </script>
</body>
</html>
