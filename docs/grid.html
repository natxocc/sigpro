<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SigPro — Demo Grid</title>
  <link rel="stylesheet" href="./demo.css" />
  <script>window.__base = location.pathname.replace(/\/[^/]+$/, '') + '/';</script>
</head>
<body>
  <header style="padding: 1rem; background: #0f172a; color: #e2e8f0;">
    <h1>SigPro demo — Grid &nbsp;<code>sandbox:sigpro/grid</code></h1>
    <nav>
      <a href="./grid.html">Grid</a> · <a href="./chart.html">Chart</a> · <a href="./calendar.html">Calendar</a> · <a href="./combined.html">Combined</a>
    </nav>
  </header>

  <div id="app"></div>

  <script type="module">
    import { signal, mount, exposeTags, h } from './sigpro.js';
    import { Grid } from './sigpro.grid.js';

    exposeTags();

    const data = signal([
      { id: 1, name: 'Natxo', country: 'ES', population: 47, active: true },
      { id: 2, name: 'Alice', country: 'FR', population: 31, active: false },
      { id: 3, name: 'Bob', country: 'DE', population: 58, active: true },
    ]);

    const App = () =>
      h('div', { class: 'app' }, [
        h('section', { class: 'card' }, [
          h('h2', {}, 'Grid — reactive rowData'),
          h('div', { id: 'grid', style: 'height: 360px; margin-bottom: .5rem' }, [
            h(Grid, {
              data,
              options: {
                columnDefs: [
                  { field: 'id', headerName: '#' },
                  { field: 'name', headerName: 'Name', editable: true },
                  { field: 'country', headerName: 'Country' },
                  { field: 'population', headerName: 'Population', type: 'numericColumn' },
                  { field: 'active', headerName: 'Active', type: 'booleanColumn' },
                ],
                defaultColDef: { sortable: true, filter: true },
              },
            }),
          ]),
        ]),
      ]);

    const stop = mount(App, '#app');

    document.querySelectorAll('a').forEach(a => a.style.color = '#93c5fd');
  </script>
</body>
</html>
