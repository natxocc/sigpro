<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SigPro — Demo PDF</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <header style="padding: 1rem; background: #0f172a; color: #e2e8f0;">
    <h1>SigPro demo — PDF Export &nbsp;<code>sandbox:sigpro/pdf</code></h1>
    <nav>
      <a href="./grid.html">Grid</a> · <a href="./chart.html">Chart</a> · <a href="./calendar.html">Calendar</a> · <a href="./pdf.html">PDF</a>
    </nav>
  </header>

  <div id="app"></div>

  <script type="module">
    import { signal, mount, exposeTags, h } from './sigpro.js';
    import { pdfFromEvents, pdfFromRows, pdfContainer } from './sigpro.pdf.js';

    exposeTags();

    const today = new Date();
    const iso = (offset) => {
      const d = new Date(today);
      d.setDate(d.getDate() + offset);
      return d.toISOString().slice(0, 10);
    };

    const events = signal([
      { id: 'e1', title: 'Sprint Planning', start: iso(0), end: iso(2) },
      { id: 'e2', title: 'Demo SigPro', start: iso(3), allDay: true, color: '#3b82f6' },
      { id: 'e3', title: 'Release Candidate', start: iso(6), end: iso(8), color: '#ef4444' },
    ]);

    const gridData = signal([
      { id: 1, name: 'Natxo', country: 'ES', role: 'Developer' },
      { id: 2, name: 'Alice', country: 'FR', role: 'Designer' },
      { id: 3, name: 'Bob', country: 'DE', role: 'Manager' },
    ]);

    const gridColumns = signal([
      { field: 'id', headerName: '#' },
      { field: 'name', headerName: 'Name' },
      { field: 'country', headerName: 'Country' },
      { field: 'role', headerName: 'Role' },
    ]);

    const App = () =>
      h('div', { class: 'app' }, [
        h('section', { class: 'card' }, [
          h('h2', {}, 'Export PDF from events'),
          h('button', {
            id: 'btn-events',
            style: 'padding: .5rem 1rem; margin-right: .5rem; cursor: pointer',
            onclick() { pdfFromEvents({ events, title: 'Eventos del Calendario', filename: 'eventos.pdf' }); },
          }, 'Descargar eventos PDF'),
          h('p', { style: 'color: #64748b; font-size: .875rem' }, '(3 eventos de ejemplo)'),
        ]),
        h('section', { class: 'card' }, [
          h('h2', {}, 'Export PDF from grid data'),
          h('button', {
            id: 'btn-data',
            style: 'padding: .5rem 1rem; margin-right: .5rem; cursor: pointer',
            onclick() { pdfFromRows({ rows: gridData, columns: gridColumns, title: 'Datos del Equipo', filename: 'equipo.pdf' }); },
          }, 'Descargar datos PDF'),
          h('p', { style: 'color: #64748b; font-size: .875rem' }, '() → 3 filas de datos reactivos'),
        ]),
        h('section', { class: 'card' }, [
          h('h2', {}, 'Exportar desde container (reactivo)'),
          h('div', { id: 'pdf-btn', style: 'margin-bottom: .5rem' }, []),
        ]),
      ]);

    mount(App, '#app');

    document.querySelectorAll('a').forEach(a => a.style.color = '#93c5fd');

    // re-render botón reactivo con pdfContainer
    const btnDiv = document.getElementById('pdf-btn');
    const stop = () => {};
    const renderBtn = () => {
      btnDiv.innerHTML = '';
      const container = mount(() => h(pdfContainer, { events, title: 'Export Reactivo', filename: 'reactivo.pdf' }), btnDiv);
    };
    renderBtn();
  </script>
</body>
</html>
